<main>
  <section class="bagian" id="pesan">
    <h1>Formulir Pemesanan Sasirangan</h1>
    <p>Isi formulir berikut. Kolom bertanda <strong>*</strong> wajib diisi.</p>

    <form id="form-pesan" class="form-pesan" action="#" method="get">
      <div class="kolom">
        <label for="nama">Nama lengkap *</label>
        <input type="text" id="nama" name="nama" required minlength="3" autocomplete="name">
      </div>

      <div class="kolom">
        <label for="wa">Nomor WhatsApp *</label>
        <input type="tel" id="wa" name="wa" required pattern="08[0-9]{8,11}"
          title="Nomor diawali 08, total 10-13 digit"
          placeholder="Contoh: 081234567890" autocomplete="tel">
      </div>

      <div class="kolom">
        <label for="email">Surel</label>
        <input type="email" id="email" name="email" autocomplete="email">
      </div>

      <fieldset>
        <legend>Jenis pesanan *</legend>
        <label><input type="radio" name="jenis-pesanan" value="Produk katalog" checked> Produk katalog (siap pakai)</label>
        <label><input type="radio" name="jenis-pesanan" value="Pesan khusus"> Pesan khusus (motif/warna sesuai permintaan)</label>
        <label><input type="radio" name="jenis-pesanan" value="Seragam atau grosir"> Seragam / grosir (instansi, keluarga, acara)</label>
      </fieldset>

      <div class="kolom">
        <label for="produk">Jenis produk *</label>
        <select id="produk" name="produk" required>
          <option value="">-- Pilih produk --</option>
          <option value="Kain">Kain Sasirangan (2 meter)</option>
          <option value="Selendang">Selendang</option>
          <option value="Kemeja">Kemeja</option>
          <option value="Gamis">Gamis</option>
          <option value="Tas">Tas</option>
        </select>
      </div>

      <div class="kolom">
        <label for="motif">Motif *</label>
        <select id="motif" name="motif" required>
          <option value="">-- Pilih motif --</option>
          <option value="Gigi Haruan">Gigi Haruan</option>
          <option value="Kambang Kacang">Kambang Kacang</option>
          <option value="Iris Pudak">Iris Pudak</option>
          <option value="Bayam Raja">Bayam Raja</option>
          <option value="Naga Balimbur">Naga Balimbur</option>
          <option value="Ombak Sinapur Karang">Ombak Sinapur Karang</option>
          <option value="Motif lain (tulis di catatan)">Motif lain (tulis di catatan)</option>
        </select>
      </div>

      <div class="kolom">
        <label for="warna">Warna dominan</label>
        <input type="text" id="warna" name="warna" maxlength="40"
          placeholder="Contoh: merah marun, hijau tosca">
      </div>

      <div class="kolom">
        <label for="ukuran">Ukuran (untuk kemeja dan gamis)</label>
        <select id="ukuran" name="ukuran">
          <option value="">-- Tidak perlu --</option>
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
          <option value="XXL">XXL</option>
        </select>
      </div>

      <div class="kolom">
        <label for="jumlah">Jumlah *</label>
        <input type="number" id="jumlah" name="jumlah" min="1" max="100" value="1" required>
      </div>

      <div class="kolom">
        <label for="tanggal">Tanggal dibutuhkan *</label>
        <input type="date" id="tanggal" name="tanggal" required>
      </div>

      <fieldset>
        <legend>Metode pengambilan *</legend>
        <label><input type="radio" name="pengambilan" value="Ambil di galeri" checked> Ambil di galeri</label>
        <label><input type="radio" name="pengambilan" value="Dikirim ke alamat"> Dikirim ke alamat</label>
      </fieldset>

      <div class="kolom" id="kolom-alamat" hidden>
        <label for="alamat">Alamat pengiriman *</label>
        <textarea id="alamat" name="alamat" rows="3" maxlength="200"
          placeholder="Jalan, kelurahan, kecamatan, kota, kode pos"></textarea>
      </div>

      <div class="kolom">
        <label for="catatan">Catatan tambahan</label>
        <textarea id="catatan" name="catatan" rows="4" maxlength="300"
          placeholder="Contoh: motif untuk seragam keluarga, tambah kantong di kemeja"></textarea>
      </div>

      <label class="cek">
        <input type="checkbox" id="setuju" name="setuju" required>
        Saya setuju data ini hanya dipakai untuk memproses pesanan. *
      </label>

      <button type="submit" class="tombol">Kirim Pesanan</button>
    </form>
  </section>
</main>
